actions:
  apisYmlUpdated: true
  openapiHarvested: false
  reason: |
    No public first-party API, developer portal, or downloadable specification
    exists for Zions Bancorporation, so apis[] is empty and the openapi/
    directory holds no harvested specs. The record is intentionally identity-only
    and documents the honest aggregator-only / no-public-API posture rather than
    fabricating an API surface.
